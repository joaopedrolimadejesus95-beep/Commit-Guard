name: "CommitGuard Code Review"
description: "Code Review automatizado com IA (Google Gemini) focado em segurança, arquitetura e performance."

branding:
  icon: "shield"
  color: "blue"

inputs:
  gemini-api-key:
    description: "Chave da API do Google Gemini (ex: secrets.GEMINI_API_KEY)."
    required: true
  repo:
    description: "Caminho do repositório Git a ser analisado."
    required: false
    default: "."
  base:
    description: "Commit ou branch base para comparação (opcional; detectado automaticamente em PR/push)."
    required: false
    default: ""
  head:
    description: "Commit ou branch alvo para comparação (opcional; detectado automaticamente em PR/push)."
    required: false
    default: ""
  fail-on:
    description: "Severidade mínima para falhar o job (none, baixa, media, alta)."
    required: false
    default: "alta"
  output:
    description: "Caminho do arquivo Markdown de relatório gerado."
    required: false
    default: "relatorio_commitguard.md"
  comment-pr:
    description: "Se 'true', publica/atualiza o relatório como comentário no Pull Request."
    required: false
    default: "true"
  github-token:
    description: "Token do GitHub para comentar no Pull Request."
    required: false
    default: ${{ github.token }}

outputs:
  report-path:
    description: "Caminho do relatório Markdown gerado."
    value: ${{ inputs.output }}

runs:
  using: "composite"
  steps:
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Instalar dependências do CommitGuard
      shell: bash
      run: pip install -r "${{ github.action_path }}/requirements.txt"

    - name: Executar CommitGuard
      id: run-guard
      shell: bash
      continue-on-error: true
      env:
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
      run: |
        BASE_REF="${{ inputs.base }}"
        HEAD_REF="${{ inputs.head }}"

        if [ -z "$BASE_REF" ] || [ -z "$HEAD_REF" ]; then
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${BASE_REF:-${{ github.event.pull_request.base.sha }}}"
            HEAD_REF="${HEAD_REF:-${{ github.event.pull_request.head.sha }}}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE_REF="${BASE_REF:-${{ github.event.before }}}"
            HEAD_REF="${HEAD_REF:-${{ github.sha }}}"
          else
            BASE_REF="${BASE_REF:-HEAD~1}"
            HEAD_REF="${HEAD_REF:-HEAD}"
          fi
        fi

        python "${{ github.action_path }}/main.py" \
          --repo "${{ inputs.repo }}" \
          --base "$BASE_REF" \
          --head "$HEAD_REF" \
          --output "${{ inputs.output }}" \
          --fail-on "${{ inputs.fail-on }}"

    - name: Publicar resumo no GitHub Actions
      if: always()
      shell: bash
      run: |
        if [ -f "${{ inputs.output }}" ]; then
          cat "${{ inputs.output }}" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Comentar relatório no Pull Request
      if: always() && inputs.comment-pr == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const outputPath = '${{ inputs.output }}';
          if (!fs.existsSync(outputPath)) return;

          const marker = '<!-- commit-guard-report -->';
          const report = fs.readFileSync(outputPath, 'utf-8');
          const body = `${marker}\n${report}`;

          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;

          const { data: comments } = await github.rest.issues.listComments({
            owner,
            repo,
            issue_number,
          });

          const existing = comments.find(
            (c) => c.user.type === 'Bot' && c.body && c.body.includes(marker)
          );

          if (existing) {
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });
          }

    - name: Verificar critério de falha
      if: steps.run-guard.outcome == 'failure'
      shell: bash
      run: |
        echo "CommitGuard encontrou problemas com severidade >= '${{ inputs.fail-on }}'."
        exit 1
