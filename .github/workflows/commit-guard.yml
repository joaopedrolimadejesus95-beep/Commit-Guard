name: CommitGuard Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  commit-guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar CommitGuard
        id: commitguard
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
            HEAD_REF="${{ github.event.pull_request.head.sha }}"
          else
            BASE_REF="${{ github.event.before }}"
            HEAD_REF="${{ github.sha }}"
          fi

          python main.py \
            --repo . \
            --base "$BASE_REF" \
            --head "$HEAD_REF" \
            --output relatorio_commitguard.md \
            --fail-on alta

      - name: Publicar resumo no GitHub Actions
        if: always()
        run: |
          if [ -f relatorio_commitguard.md ]; then
            cat relatorio_commitguard.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comentar relatório no Pull Request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('relatorio_commitguard.md')) return;

            const marker = '<!-- commit-guard-report -->';
            const report = fs.readFileSync('relatorio_commitguard.md', 'utf-8');
            const body = `${marker}\n${report}`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });

            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Falhar se houver problemas de severidade Alta
        if: steps.commitguard.outcome == 'failure'
        run: |
          echo "CommitGuard encontrou problemas críticos (severidade Alta)."
          exit 1
